<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zodiac Cake Bakery</title>

  <link rel="stylesheet" href="css/detail.css">
</head>

<body class="detail-page">

  <a class="back-button" href="gallery.html">
    ← Back to Bakery
  </a>

  <main class="bakery-layout">

    <!-- LEFT: CAKE DISPLAY -->
    <div class="cake-section">

      <nav class="cake-tabs" aria-label="Cake information tabs">

        <button class="tab-button active" type="button">
          <img
            src="images/ui/tabs/infotab-down.png"
            alt="Info"
          >
        </button>

        <button class="tab-button" type="button">
          <img
            src="images/ui/tabs/recipetab-up.png"
            alt="Recipe"
          >
        </button>

        <button class="tab-button" type="button">
          <img
            src="images/ui/tabs/storytab-up.png"
            alt="Story"
          >
        </button>

        <button class="tab-button" type="button">
          <img
            src="images/ui/tabs/wishtab-up.png"
            alt="Wish"
          >
        </button>

      </nav>

      <div class="cake-frame">

        <img
          class="main-frame-image"
          src="images/ui/frame/frame-main.png"
          alt=""
        >

        <div class="cake-display-content">

          <!-- 之後再把蛋糕放進這裡 -->
          <p class="temporary-label">
            Cake goes here
          </p>

        </div>

      </div>

    </section>


    <!-- RIGHT: REGISTER AND RECEIPT -->
    <div class="register-section">

      <div class="register-wrap">

        <img
          class="register-image"
          src="images/ui/register/register-main.png"
          alt="Zodiac Cake Shop cash register"
        >

        <div class="receipt-area">

          <div class="receipt-stack">

            <img
              class="receipt-paper"
              src="images/ui/register/receipt-stage-3.png"
              alt=""
            >

            <div class="receipt-content">

              <p class="receipt-shop-name">
                ZODIAC CAKE SHOP
              </p>

              <div class="receipt-divider"></div>

              <h1>ARIES</h1>

              <p>
                March 21 – April 19
              </p>

              <p>
                Element: Fire
              </p>

            </div>

            <img
              class="receipt-roll"
              src="images/ui/register/roll-4.png"
              alt=""
            >

          </div>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
